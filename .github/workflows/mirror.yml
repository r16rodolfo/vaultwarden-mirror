name: Espelhar imagens Vaultwarden

on:
  schedule:
    - cron: "17 5 * * *" # diário, 05:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: mirror
  cancel-in-progress: false

env:
  OWNER: ${{ github.repository_owner }}
  SOURCE_ANNOTATION: https://github.com/${{ github.repository }}

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Espelhar versões mais recentes
        id: mirror
        shell: bash
        run: |
          set -euo pipefail

          # Maior tag que casa com o regex, lida do Docker Hub (2 páginas de 100 bastam)
          latest_tag() {
            local repo="$1" regex="$2"
            for page in 1 2; do
              curl -fsSL "https://hub.docker.com/v2/repositories/${repo}/tags?page_size=100&page=${page}&ordering=last_updated" \
                | jq -r '.results[].name' || true
            done | grep -E "$regex" | sort -V | tail -n1 || true
          }

          # Copia src -> dst (todas as arquiteturas) se dst ainda não existir. Retorna 0 se copiou.
          mirror() {
            local src="$1" dst="$2"
            if docker buildx imagetools inspect "$dst" >/dev/null 2>&1; then
              echo "já existe: $dst"
              return 1
            fi
            echo "copiando: $src -> $dst"
            docker buildx imagetools create \
              --annotation "index:org.opencontainers.image.source=${SOURCE_ANNOTATION}" \
              --tag "$dst" "$src"
            return 0
          }

          server_tag="$(latest_tag vaultwarden/server '^[0-9]+\.[0-9]+\.[0-9]+$')"
          web_tag="$(latest_tag vaultwarden/web-vault '^v[0-9]+\.[0-9]+\.[0-9]+$')"
          if [[ -z "$server_tag" || -z "$web_tag" ]]; then
            echo "::error::Não foi possível ler as tags do Docker Hub (server='$server_tag' web='$web_tag'). As imagens já espelhadas continuam no GHCR."
            exit 1
          fi
          echo "server=$server_tag web-vault=$web_tag"

          new_server=false
          if mirror "docker.io/vaultwarden/server:${server_tag}" "ghcr.io/${OWNER}/vaultwarden:${server_tag}"; then
            new_server=true
          fi
          new_web=false
          if mirror "docker.io/vaultwarden/web-vault:${web_tag}" "ghcr.io/${OWNER}/vaultwarden-web-vault:${web_tag}"; then
            new_web=true
          fi

          echo "server_tag=$server_tag" >> "$GITHUB_OUTPUT"
          echo "web_tag=$web_tag" >> "$GITHUB_OUTPUT"
          echo "new_server=$new_server" >> "$GITHUB_OUTPUT"
          echo "new_web=$new_web" >> "$GITHUB_OUTPUT"

      - name: Registrar versões e manter o repositório ativo
        shell: bash
        env:
          SERVER_TAG: ${{ steps.mirror.outputs.server_tag }}
          WEB_TAG: ${{ steps.mirror.outputs.web_tag }}
          NEW_SERVER: ${{ steps.mirror.outputs.new_server }}
          NEW_WEB: ${{ steps.mirror.outputs.new_web }}
        run: |
          set -euo pipefail
          today="$(date -u +%Y-%m-%d)"
          changed=false

          if [[ "$NEW_SERVER" == "true" ]]; then
            echo "| ${today} | server | ${SERVER_TAG} | ghcr.io/${OWNER}/vaultwarden:${SERVER_TAG} |" >> VERSIONS.md
            changed=true
          fi
          if [[ "$NEW_WEB" == "true" ]]; then
            echo "| ${today} | web-vault | ${WEB_TAG} | ghcr.io/${OWNER}/vaultwarden-web-vault:${WEB_TAG} |" >> VERSIONS.md
            changed=true
          fi

          # O GitHub desliga workflows agendados após 60 dias sem atividade no repo.
          # Sem versão nova há 40+ dias, grava um heartbeat para manter o agendamento vivo.
          last_commit="$(git log -1 --format=%ct)"
          if [[ "$changed" == "false" && $(( $(date +%s) - last_commit )) -gt $(( 40 * 86400 )) ]]; then
            echo "$today" > .heartbeat
            changed=true
          fi

          if [[ "$changed" == "true" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898232+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "mirror: server ${SERVER_TAG}, web-vault ${WEB_TAG}"
            git push
          fi

      - name: Publicar release da nova versão do servidor
        if: steps.mirror.outputs.new_server == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SERVER_TAG: ${{ steps.mirror.outputs.server_tag }}
        run: |
          gh release create "${SERVER_TAG}" \
            --title "Vaultwarden ${SERVER_TAG}" \
            --notes "Imagem espelhada: \`ghcr.io/${OWNER}/vaultwarden:${SERVER_TAG}\`

          Notas da versão (upstream): https://github.com/dani-garcia/vaultwarden/releases/tag/${SERVER_TAG}

          O Railway aplica esta versão na próxima janela de manutenção (auto update nativo)."
